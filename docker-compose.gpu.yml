services:
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.gpu
      target: ""
    runtime: nvidia
    environment:
      DEVICE: cuda
      COMPUTE_TYPE: ${COMPUTE_TYPE:-float16}
      BATCH_SIZE: ${BATCH_SIZE:-4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
